name: Tag on version bump

# When a push to main changes "version" in plugin.json, create tag v<version>
# and dispatch the Release workflow on that tag (tags pushed with GITHUB_TOKEN
# do not trigger other workflows).

on:
  push:
    branches: [main]
    paths: [plugin.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: v
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          new=$(jq -r .version plugin.json)
          old=$(git show "$BEFORE:plugin.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ -z "$new" ] || [ "$new" = "null" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [ "$new" = "$old" ]; then
            echo "plugin.json changed but version did not ($new)"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "Tag v$new already exists"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: ${old:-<none>} -> $new"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.v.outputs.bump == 'true'
        run: |
          tag="v${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag" "${{ github.sha }}"
          git push origin "$tag"

      - name: Dispatch release workflow
        if: steps.v.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.v.outputs.version }}"
