name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run with --ref <tag> (used by tag.yml)

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify ref is a tag matching plugin.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this workflow on a tag ref"; exit 1
          fi
          ver="${GITHUB_REF_NAME#v}"
          pj=$(jq -r .version plugin.json)
          if [ "$ver" != "$pj" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $pj"; exit 1
          fi

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml

  release:
    needs: [check, build]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## / { if (found) exit; if ($2 == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $ver; using generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      # One directory per platform; files are NOT merged into a single archive.
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts/*/
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME")
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/*/*.vcvplugin "${args[@]}"
